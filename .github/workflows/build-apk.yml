name: Build BunkIn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # App settings from Settings > Secrets and variables > Actions > Variables.
    # They are baked into the app when it is built, so changing one needs a new build.
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TILE_URL: ${{ vars.EXPO_PUBLIC_TILE_URL }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.EXPO_PUBLIC_ROUTING_URL }}
      EXPO_PUBLIC_GEOCODING_URL: ${{ vars.EXPO_PUBLIC_GEOCODING_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check app settings
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository VARIABLE $name (Settings > Secrets and variables > Actions > Variables)"; missing=1; fi
          done
          exit $missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g -XX:MaxMetaspaceSize=1g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BunkIn-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
